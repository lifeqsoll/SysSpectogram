[package]
name = "sysspectogram-ebpf"
version = "0.4.0"
edition = "2021"
publish = false

[dependencies]
sysspectogram-common = { path = "../common" }
aya-ebpf = "0.1"
aya-log-ebpf = "0.1"

[build-dependencies]
which = "6"

[[bin]]
name = "sysspectogram-ebpf"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
