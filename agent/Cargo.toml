[workspace]
resolver = "2"
members = [".", "common"]
default-members = ["."]

[package]
name = "sysspectogram-agent"
version = "1.5.0"
edition = "2021"
description = "Syscall / process integrity sensor (userspace + Aya-loaded clang BPF probes)"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
notify = "8"
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
signal-hook = { version = "0.3", features = ["iterator", "extended-siginfo"] }
aya = { version = "0.13", optional = true }
bytes = { version = "1", optional = true }
sysspectogram-common = { path = "common", features = ["user"], optional = true }
tract-onnx = { version = "0.21.19", optional = true }

[features]
default = ["ebpf"]
ebpf = ["dep:aya", "dep:bytes", "dep:sysspectogram-common"]
# Optional host-side ONNX scorer. Not in the default agent build.
onnx = ["dep:tract-onnx"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
