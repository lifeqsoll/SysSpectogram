[workspace]
resolver = "2"
members = [".", "common"]
default-members = ["."]

[package]
name = "sysspectogram-agent"
version = "0.4.0"
edition = "2021"
description = "Syscall / process integrity sensor (userspace + Aya-loaded clang BPF probes)"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
notify = "7"
sha2 = "0.10"
aya = { version = "0.13", optional = true }
libc = { version = "0.2", optional = true }
bytes = { version = "1", optional = true }
sysspectogram-common = { path = "common", features = ["user"], optional = true }

[features]
default = ["ebpf"]
ebpf = ["dep:aya", "dep:libc", "dep:bytes", "dep:sysspectogram-common"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
