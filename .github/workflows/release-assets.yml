name: release-assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  musl-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: build musl agent
        working-directory: agent
        env:
          SYSSPECTOGRAM_SKIP_EBPF: "1"
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --no-default-features
          cp target/x86_64-unknown-linux-musl/release/sysspectogram-agent \
            ../sysspectogram-agent-x86_64-linux-musl
          sha256sum ../sysspectogram-agent-x86_64-linux-musl | tee ../sysspectogram-agent-x86_64-linux-musl.sha256
      - name: build Python release assets and SBOM
        run: |
          python3 -m pip install --upgrade build
          python3 -m pip install -e .
          python3 -m build --outdir dist
          python3 scripts/generate-sbom.py --out dist/sbom.spdx.json \
            --file sysspectogram-agent-x86_64-linux-musl \
            --file sysspectogram-agent-x86_64-linux-musl.sha256
          sha256sum dist/* sysspectogram-agent-x86_64-linux-musl* \
            | sort -k2 > dist/SHA256SUMS
      - name: sign release assets with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["MINISIGN_SECRET_KEY"].replace("\r\n", "\n").strip("\n") + "\n"
          if "\\n" in raw and raw.count("\n") < 2:
              raw = raw.replace("\\n", "\n")
          path = Path(os.environ["RUNNER_TEMP"]) / "minisign.key"
          path.write_text(raw)
          path.chmod(0o600)
          first = path.read_text().splitlines()[0]
          if "secret key" not in first.lower() and not first.startswith("RWR"):
              raise SystemExit(f"MINISIGN_SECRET_KEY looks malformed (first line: {first[:60]!r})")
          print(f"secret key lines={len(path.read_text().splitlines())}")
          PY
          printf '%s\n' "$MINISIGN_PUBLIC_KEY" > dist/SysSpectogram.minisign.pub
          sign_one() {
            # passworded keys need MINISIGN_PASSWORD; empty-password keys get a blank line
            printf '%s\n' "${MINISIGN_PASSWORD-}" | minisign -S \
              -s "$RUNNER_TEMP/minisign.key" -m "$1" -x "$2"
          }
          while IFS= read -r -d '' asset; do
            sign_one "$asset" "$asset.minisig"
          done < <(find dist -maxdepth 1 -type f ! -name '*.minisig' ! -name '*.pub' -print0)
          sign_one sysspectogram-agent-x86_64-linux-musl \
            sysspectogram-agent-x86_64-linux-musl.minisig
          sign_one sysspectogram-agent-x86_64-linux-musl.sha256 \
            sysspectogram-agent-x86_64-linux-musl.sha256.minisig
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            sysspectogram-agent-x86_64-linux-musl
            sysspectogram-agent-x86_64-linux-musl.sha256
            sysspectogram-agent-x86_64-linux-musl.minisig
            sysspectogram-agent-x86_64-linux-musl.sha256.minisig
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  profile-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: upload local dist packs if present
        run: |
          mkdir -p dist
          if ls dist/profile-*.tar.gz 1>/dev/null 2>&1; then
            sha256sum dist/profile-*.tar.gz | tee dist/SHA256SUMS
          else
            echo "no packs in dist/ - build on builder PC via role-lab / pack-role.sh"
          fi
      - name: sign profile packs when present
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          packs=(dist/profile-*.tar.gz)
          if (( ${#packs[@]} == 0 )); then
            echo "no profile packs to sign — skip"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PUBLIC_KEY:-}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["MINISIGN_SECRET_KEY"].replace("\r\n", "\n").strip("\n") + "\n"
          if "\\n" in raw and raw.count("\n") < 2:
              raw = raw.replace("\\n", "\n")
          path = Path(os.environ["RUNNER_TEMP"]) / "minisign.key"
          path.write_text(raw)
          path.chmod(0o600)
          PY
          printf '%s\n' "$MINISIGN_PUBLIC_KEY" > dist/SysSpectogram.minisign.pub
          for asset in dist/profile-*.tar.gz dist/profile-*.tar.gz.sha256 dist/SHA256SUMS; do
            if [[ -f "$asset" ]]; then
              printf '%s\n' "${MINISIGN_PASSWORD-}" | minisign -S \
                -s "$RUNNER_TEMP/minisign.key" -m "$asset" -x "$asset.minisig"
            fi
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            dist/profile-*.tar.gz
            dist/profile-*.tar.gz.sha256
            dist/SHA256SUMS
            dist/*.minisig
            dist/SysSpectogram.minisign.pub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
