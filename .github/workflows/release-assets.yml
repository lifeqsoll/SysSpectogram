name: release-assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach assets to (e.g. v1.1.0). Empty = use ref name."
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  musl-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: build musl agent
        working-directory: agent
        env:
          SYSSPECTOGRAM_SKIP_EBPF: "1"
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --no-default-features
          cp target/x86_64-unknown-linux-musl/release/sysspectogram-agent \
            ../sysspectogram-agent-x86_64-linux-musl
          sha256sum ../sysspectogram-agent-x86_64-linux-musl | tee ../sysspectogram-agent-x86_64-linux-musl.sha256
      - name: build Python release assets and SBOM
        run: |
          python3 -m pip install --upgrade build
          python3 -m pip install -e .
          python3 -m build --outdir dist
          python3 scripts/generate-sbom.py --out dist/sbom.spdx.json \
            --file sysspectogram-agent-x86_64-linux-musl \
            --file sysspectogram-agent-x86_64-linux-musl.sha256
          sha256sum dist/* sysspectogram-agent-x86_64-linux-musl* \
            | sort -k2 > dist/SHA256SUMS
      - name: sign release assets with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PUBLIC_KEY:-}"
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            if ! sudo apt-get install -y -qq minisign; then
              curl -fsSL -o /tmp/minisign.tgz \
                "https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz"
              tar -xzf /tmp/minisign.tgz -C /tmp
              sudo install -m755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
            fi
          fi
          command -v minisign
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["MINISIGN_SECRET_KEY"].replace("\r\n", "\n").strip("\n") + "\n"
          if "\\n" in raw and raw.count("\n") < 2:
              raw = raw.replace("\\n", "\n")
          path = Path(os.environ["RUNNER_TEMP"]) / "minisign.key"
          path.write_text(raw)
          path.chmod(0o600)
          first = path.read_text().splitlines()[0]
          if "secret key" not in first.lower() and not first.startswith("RWR"):
              raise SystemExit(f"MINISIGN_SECRET_KEY looks malformed (first line: {first[:60]!r})")
          print(f"secret key lines={len(path.read_text().splitlines())}")
          PY
          printf '%s\n' "$MINISIGN_PUBLIC_KEY" > dist/SysSpectogram.minisign.pub
          sign_one() {
            # passworded keys need MINISIGN_PASSWORD; empty-password keys get a blank line
            printf '%s\n' "${MINISIGN_PASSWORD-}" | minisign -S \
              -s "$RUNNER_TEMP/minisign.key" -m "$1" -x "$2"
          }
          while IFS= read -r -d '' asset; do
            sign_one "$asset" "$asset.minisig"
          done < <(find dist -maxdepth 1 -type f ! -name '*.minisig' ! -name '*.pub' -print0)
          sign_one sysspectogram-agent-x86_64-linux-musl \
            sysspectogram-agent-x86_64-linux-musl.minisig
          sign_one sysspectogram-agent-x86_64-linux-musl.sha256 \
            sysspectogram-agent-x86_64-linux-musl.sha256.minisig
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            sysspectogram-agent-x86_64-linux-musl
            sysspectogram-agent-x86_64-linux-musl.sha256
            sysspectogram-agent-x86_64-linux-musl.minisig
            sysspectogram-agent-x86_64-linux-musl.sha256.minisig
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helper:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper
      - name: Build privileged helper
        working-directory: helper
        run: |
          cargo build --release
          cp target/release/sysspectogram-helper ../sysspectogram-helper-x86_64-linux
          sha256sum ../sysspectogram-helper-x86_64-linux | tee ../sysspectogram-helper-x86_64-linux.sha256
      - name: Sign helper
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PUBLIC_KEY:-}"
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            if ! sudo apt-get install -y -qq minisign; then
              curl -fsSL -o /tmp/minisign.tgz \
                "https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz"
              tar -xzf /tmp/minisign.tgz -C /tmp
              sudo install -m755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
            fi
          fi
          command -v minisign
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["MINISIGN_SECRET_KEY"].replace("\r\n", "\n").strip("\n") + "\n"
          if "\\n" in raw and raw.count("\n") < 2:
              raw = raw.replace("\\n", "\n")
          path = Path(os.environ["RUNNER_TEMP"]) / "minisign.key"
          path.write_text(raw)
          path.chmod(0o600)
          PY
          for asset in sysspectogram-helper-x86_64-linux sysspectogram-helper-x86_64-linux.sha256; do
            printf '%s\n' "${MINISIGN_PASSWORD-}" | minisign -S \
              -s "$RUNNER_TEMP/minisign.key" -m "$asset" -x "$asset.minisig"
          done
      - name: Bundle friend helper install scripts
        run: |
          cp scripts/install-helper-from-release.sh .
          cp scripts/friend-day0.sh .
          tar -czf sysspectogram-helper-packaging.tgz \
            packaging/helper/sysspectogram-helper.service \
            packaging/helper/sysusers.conf \
            packaging/polkit/org.sysspectogram.helper.policy \
            scripts/install-helper-from-release.sh
          sha256sum install-helper-from-release.sh friend-day0.sh sysspectogram-helper-packaging.tgz \
            | tee friend-scripts.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            sysspectogram-helper-x86_64-linux
            sysspectogram-helper-x86_64-linux.sha256
            sysspectogram-helper-x86_64-linux.minisig
            sysspectogram-helper-x86_64-linux.sha256.minisig
            install-helper-from-release.sh
            friend-day0.sh
            sysspectogram-helper-packaging.tgz
            friend-scripts.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  control-center:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev build-essential file wget \
            xdg-utils librsvg2-bin libgtk-3-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: control-center/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - name: Build Control Center AppImage + deb
        working-directory: control-center
        run: |
          npm ci
          npm run tauri build -- --bundles appimage,deb
      - name: Collect desktop bundles
        run: |
          set -euo pipefail
          mkdir -p dist/desktop
          shopt -s nullglob
          for f in \
            control-center/src-tauri/target/release/bundle/appimage/*.AppImage \
            control-center/src-tauri/target/release/bundle/deb/*.deb; do
            base="$(basename "$f")"
            safe="${base// /_}"
            cp -v "$f" "dist/desktop/$safe"
          done
          test -n "$(ls -A dist/desktop)" || { echo "no AppImage/deb produced"; exit 1; }
          # Must NOT be named SHA256SUMS — that name is reserved for wheel/agent
          # (friend-day0 / Install stack / friend_update). Desktop overwrites would break install.
          (cd dist/desktop && sha256sum * | sort -k2 > SHA256SUMS.desktop)
          ls -la dist/desktop
      - name: Sign desktop bundles
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PUBLIC_KEY:-}"
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            if ! sudo apt-get install -y -qq minisign; then
              curl -fsSL -o /tmp/minisign.tgz \
                "https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz"
              tar -xzf /tmp/minisign.tgz -C /tmp
              sudo install -m755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
            fi
          fi
          command -v minisign
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["MINISIGN_SECRET_KEY"].replace("\r\n", "\n").strip("\n") + "\n"
          if "\\n" in raw and raw.count("\n") < 2:
              raw = raw.replace("\\n", "\n")
          path = Path(os.environ["RUNNER_TEMP"]) / "minisign.key"
          path.write_text(raw)
          path.chmod(0o600)
          PY
          printf '%s\n' "$MINISIGN_PUBLIC_KEY" > dist/desktop/SysSpectogram.minisign.pub
          for asset in dist/desktop/*; do
            case "$asset" in
              *.minisig|*.pub) continue ;;
            esac
            printf '%s\n' "${MINISIGN_PASSWORD-}" | minisign -S \
              -s "$RUNNER_TEMP/minisign.key" -m "$asset" -x "$asset.minisig"
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            dist/desktop/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  profile-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: upload local dist packs if present
        run: |
          mkdir -p dist
          if ls dist/profile-*.tar.gz 1>/dev/null 2>&1; then
            sha256sum dist/profile-*.tar.gz | tee dist/SHA256SUMS.profiles
          else
            echo "no packs in dist/ - build on builder PC via role-lab / pack-role.sh"
          fi
      - name: sign profile packs when present
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          packs=(dist/profile-*.tar.gz)
          if (( ${#packs[@]} == 0 )); then
            echo "no profile packs to sign — skip"
            exit 0
          fi
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PUBLIC_KEY:-}"
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -qq || true
            if ! sudo apt-get install -y -qq minisign; then
              curl -fsSL -o /tmp/minisign.tgz \
                "https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz"
              tar -xzf /tmp/minisign.tgz -C /tmp
              sudo install -m755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
            fi
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          raw = os.environ["MINISIGN_SECRET_KEY"].replace("\r\n", "\n").strip("\n") + "\n"
          if "\\n" in raw and raw.count("\n") < 2:
              raw = raw.replace("\\n", "\n")
          path = Path(os.environ["RUNNER_TEMP"]) / "minisign.key"
          path.write_text(raw)
          path.chmod(0o600)
          PY
          printf '%s\n' "$MINISIGN_PUBLIC_KEY" > dist/SysSpectogram.minisign.pub
          for asset in dist/profile-*.tar.gz dist/profile-*.tar.gz.sha256 dist/SHA256SUMS.profiles; do
            if [[ -f "$asset" ]]; then
              printf '%s\n' "${MINISIGN_PASSWORD-}" | minisign -S \
                -s "$RUNNER_TEMP/minisign.key" -m "$asset" -x "$asset.minisig"
            fi
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: false
          files: |
            dist/profile-*.tar.gz
            dist/profile-*.tar.gz.sha256
            dist/SHA256SUMS.profiles
            dist/*.minisig
            dist/SysSpectogram.minisign.pub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
