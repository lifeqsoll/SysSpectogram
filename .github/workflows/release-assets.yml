name: release-assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  musl-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools clang llvm
      - name: build musl agent
        working-directory: agent
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --no-default-features || \
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/sysspectogram-agent \
            ../sysspectogram-agent-x86_64-linux-musl
          sha256sum ../sysspectogram-agent-x86_64-linux-musl | tee ../sysspectogram-agent-x86_64-linux-musl.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            sysspectogram-agent-x86_64-linux-musl
            sysspectogram-agent-x86_64-linux-musl.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  profile-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: upload local dist packs if present
        run: |
          if ls dist/profile-*.tar.gz 1>/dev/null 2>&1; then
            sha256sum dist/profile-*.tar.gz | tee dist/SHA256SUMS
          else
            echo "no packs in dist/ - build on builder PC via role-lab / pack-role.sh"
          fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/profile-*.tar.gz
            dist/profile-*.tar.gz.sha256
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
