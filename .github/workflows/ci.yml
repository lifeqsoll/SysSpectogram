name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  py:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install (dev + CPU torch for ML imports)
        run: |
          pip install -U pip
          pip install -e ".[dev,ml]" --extra-index-url https://download.pytorch.org/whl/cpu
          # CPU runners: triton (GPU) can double-register / segfault on import (exit 139).
          pip uninstall -y triton pytorch-triton || true
          pip install pip-audit ruff
          # check_versions needs tomllib (3.11+) or tomli backport on 3.10
          python -c "import tomllib" 2>/dev/null || pip install tomli
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
      - name: version sync
        run: python scripts/check_versions.py
      - name: ruff
        run: ruff check sysspectogram tests scripts --select E9,F63,F7,F82
      - run: pytest -q --ignore=tests/test_rolelab.py
      - run: pytest -q tests/test_rolelab.py
      - name: supply-chain and package checks
        if: matrix.python-version == '3.12'
        run: |
          python scripts/generate-sbom.py --out /tmp/sysspectogram.spdx.json
          python -m sysspectogram supply-chain sbom --output /tmp/sysspectogram-cli.spdx.json
          python -m py_compile scripts/generate-sbom.py
          bash -n scripts/package-smoke.sh scripts/verify-release.sh
          bash scripts/package-smoke.sh
          python -m sysspectogram --version
      - name: dependency audit
        if: matrix.python-version == '3.12'
        # --skip-editable emits a skip warning that fails --strict; still fails on vulns.
        run: pip-audit --skip-editable

  py-notorch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install wheel extras only (no torch)
        run: |
          pip install -U pip
          pip install -e ".[dev]"
      - name: guard imports without torch
        run: |
          python -c "import torch" 2>/dev/null && { echo "torch unexpectedly installed"; exit 1; } || true
          python -c "import sysspectogram.ml; print('ml_ok')"
          python -c "from sysspectogram.ml.infer import load_inferencer; print('infer_ok')"
          python -m sysspectogram --help >/dev/null
          python -m sysspectogram --version

  control-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: control-center/package-lock.json
      - name: check + vitest
        working-directory: control-center
        run: |
          npm ci
          npm run check
          npm test

  fleet-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fleet-center/package-lock.json
      - name: check + vitest + build
        working-directory: fleet-center
        run: |
          npm ci
          npm run check
          npm test
          npm run build

  agent:
    runs-on: ubuntu-latest
    env:
      # CI runners lack bpf asm headers; userspace agent is enough for unit tests
      SYSSPECTOGRAM_SKIP_EBPF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test + build agent (userspace, skip BPF object)
        working-directory: agent
        run: |
          cargo test -q --no-default-features
          cargo build --release -q --no-default-features

  rust-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo metadata --locked (all Rust projects)
        run: |
          set -euo pipefail
          for d in agent helper control-center/src-tauri fleet-center/src-tauri; do
            echo "== $d =="
            (cd "$d" && cargo metadata --locked --format-version 1 >/dev/null)
          done

  nft-real:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install nftables + package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          pip install -U pip
          pip install -e ".[dev]"
      - name: real nft named-set bans in netns
        run: |
          sudo unshare -n env PATH="$PATH" "$(which python)" -m pytest -q -m nft_real
