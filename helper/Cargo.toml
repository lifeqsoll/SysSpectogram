[package]
name = "sysspectogram-helper"
version = "1.3.0"
edition = "2021"
description = "Root-side gate for the SysSpectogram Control Center (allowlisted operations, polkit-checked)"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"
