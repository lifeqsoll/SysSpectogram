[package]
name = "sysspectogram-control-center"
version = "1.3.2"
description = "SysSpectogram Control Center: desktop UI for protection, dashboards, lab and settings"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.12", default-features = true, features = ["tls"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
