# Resource budget: lite = small VPS (~1–2 vCPU); full = large VDS (4+ vCPU).
# Rates (poll/interval/cores) come from the preset — only override if you need a custom mix.
# Env: SYSSPECTOGRAM_LOAD_PROFILE=full
load_profile: lite

# Semantic defaults (not rate-budget). Rate keys live in load_profile presets.
collector: {}
window:
  size: 60
  stride: 5

train:
  epochs: 25
  batch_size: 32
  lr: 0.001
  val_ratio: 0.2
  seed: 42
  cnn_weight: 0.55
  iforest_weight: 0.45
  recall_target: 0.85

monitor: {}

ensemble:
  default_threshold: 0.5
  host_weight: 0.6
  agent_weight: 0.4
  risk_threshold: null

host:
  id: null

perimeter:
  fail_threshold: 8
  fail_window_sec: 60
  scan_unique_ips: 8
  scan_window_sec: 60
  state_path: state/perimeter.json
  jsonl_out: reports/perimeter.jsonl
  denylist_paths:
    - configs/denylist.txt
  alert_new_egress: false
  suspicious_domains:
    - malware.test
    - c2.example
  auto_ban:
    enabled: false
    rules:
      - bruteforce_ssh
      - egress_denylist_hit
      - honeypot_hit
      - lockdown_inbound
    ttl_sec: 3600

recon:
  auto: false
  nmap: false
  cooldown_sec: 900
  dir: reports/recon
  passive_dns_url: null

telegram:
  bot_token: null
  chat_id: null
  token_secret: null
  allow_destructive_sims: false
  require_console_unlock: true
  unlock_ttl_sec: 7200

web:
  enabled: false
  host: 127.0.0.1
  port: 8765
  public_url: null

siem:
  webhook_url: null
  webhook_secret: null

lab:
  mode: false
  nmap_targets:
    - 127.0.0.1
    - "::1"

honeypot:
  enabled: false
  port: 2222

flow: {}

agent:
  enabled: true
  auto_start: true
  socket: null
  binary: null
  jsonl: reports/agent.jsonl
  score_window_sec: 120
  score_threshold: 0.65
  iforest: null
  require_same_uid: true
