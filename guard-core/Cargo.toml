[package]
name = "sysspectogram-guard-core"
version = "1.5.0"
edition = "2021"
description = "Rust control-plane loops for SysSpectogram (metrics/flow/alerts)"
license = "MIT"
publish = false

[[bin]]
name = "sysspectogram-guard-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series"] }

[dev-dependencies]
tempfile = "3"
