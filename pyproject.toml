[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysspectogram"
version = "0.4.0"
description = "Linux hybrid ML host IDS + perimeter + Rust agent + shareable profile packs (v0.4)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Salfetka" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "psutil>=5.9",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "rich>=13.0",
    "dnspython>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sysspectogram = "sysspectogram.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sysspectogram*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
