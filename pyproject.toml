[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysspectogram"
version = "1.2.0"
description = "Self-hosted Linux VPS / host guard: plain-language alerts, Telegram, charts in a desktop app, optional web UI, Rust integrity agent, and optional host ML (train elsewhere — run ONNX on the VPS)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "lifeqsoll" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "psutil>=5.9",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "dnspython>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "tomli>=2.0; python_version < '3.11'"]
ml = ["torch>=2.0"]
onnx = ["onnxruntime>=1.16"]
all = ["torch>=2.0", "onnxruntime>=1.16"]

[project.scripts]
sysspectogram = "sysspectogram.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sysspectogram*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
